version: '3.8'

services:
  # 1. PostgreSQL 16 Metadata Database
  postgres:
    image: postgres:16-alpine
    container_name: sinonom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sinonom_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sinonom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sinonom-net

  # 2. Redis Cache & Celery Message Broker
  redis:
    image: redis:7-alpine
    container_name: sinonom-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sinonom-net

  # 3. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: sinonom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - sinonom-net

  # 4. FastAPI Backend API & Pipeline Orchestrator
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sinonom-backend
    restart: unless-stopped
    command: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sinonom_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sinonom-corpus}
      MINIO_SECURE: "false"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sinonom-net

  # 5. Celery Asynchronous Worker
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sinonom-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 2
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sinonom_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-sinonom-corpus}
      MINIO_SECURE: "false"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - sinonom-net

  # 6. React / Vite Frontend (Human-in-the-Loop Web Studio)
  frontend:
    build:
      context: .
      dockerfile: web-studio/Dockerfile
    container_name: sinonom-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sinonom-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local

networks:
  sinonom-net:
    driver: bridge
